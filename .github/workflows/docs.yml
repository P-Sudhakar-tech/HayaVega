name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Mangoo with docs dependencies (pure-Python, no Rust build needed for docs)
        run: pip install -e ".[docs]"
        env:
          MANGOO_SKIP_NATIVE_BUILD: "1"
      - name: Configure git identity for mike's gh-pages commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Read project version
        id: version
        run: python -c "import tomllib; print('version=' + tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])" >> "$GITHUB_OUTPUT"
      - name: Deploy versioned docs with mike
        run: |
          mike deploy --push --update-aliases "${{ steps.version.outputs.version }}" latest
          mike set-default --push latest
