name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.16"
      - name: Check lint rules (pyflakes, import sorting, pyupgrade, bugbear)
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Mangoo with dev dependencies (pure-Python fallback, no Rust build)
        run: pip install -e ".[dev]"
        env:
          MANGOO_SKIP_NATIVE_BUILD: "1"
      - name: Check type hints
        run: mypy

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upgrade pip and setuptools (audited separately -- runner tooling, not a project dependency)
        run: python -m pip install --upgrade pip setuptools
      - name: Install Mangoo with every optional Python dependency (dev, docs, DB drivers)
        run: pip install -e ".[dev,docs]" "psycopg[binary]" pymysql cryptography pip-audit
        env:
          MANGOO_SKIP_NATIVE_BUILD: "1"
      - name: Audit Python dependencies against the PyPI/OSV advisory databases
        run: pip-audit
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies against the RustSec advisory database
        run: cargo audit

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Mangoo with docs dependencies (pure-Python fallback, no Rust build)
        run: pip install -e ".[dev,docs]"
        env:
          MANGOO_SKIP_NATIVE_BUILD: "1"
      - name: Build the documentation site (fails on any warning, including broken links)
        run: mkdocs build --strict

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Mangoo with test dependencies (pure-Python fallback, no Rust build)
        run: pip install -e ".[dev]"
        env:
          MANGOO_SKIP_NATIVE_BUILD: "1"
      - name: Run tests with coverage
        run: pytest

  native-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Mangoo with test dependencies (builds and bundles mangoo_native automatically)
        run: pip install -e ".[dev]"
      - name: Confirm the native extension loaded, then run the tests it backs
        run: |
          python -c "import mangoo_native; print(mangoo_native.SignalDispatcher)"
          pytest tests/test_collections.py tests/test_signals_addon.py tests/test_signals_integration.py tests/test_rust_runtime.py tests/test_rust_runtime_hardening.py tests/test_rust_runtime_tls.py --no-cov -v

  postgresql-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mangoo_test
          POSTGRES_USER: mangoo
          POSTGRES_PASSWORD: mangoo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mangoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Mangoo with test and PostgreSQL dependencies
        run: pip install -e ".[dev]" "psycopg[binary]"
        env:
          MANGOO_SKIP_NATIVE_BUILD: "1"
      - name: Run the opt-in PostgreSQL integration test
        env:
          MANGOO_TEST_POSTGRES_NAME: mangoo_test
          MANGOO_TEST_POSTGRES_HOST: localhost
          MANGOO_TEST_POSTGRES_PORT: "5432"
          MANGOO_TEST_POSTGRES_USER: mangoo
          MANGOO_TEST_POSTGRES_PASSWORD: mangoo
        run: pytest tests/test_postgresql_integration.py --no-cov -v

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: mangoo_test
          MYSQL_USER: mangoo
          MYSQL_PASSWORD: mangoo
          MYSQL_ROOT_PASSWORD: mangoo
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -pmangoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Mangoo with test and MySQL dependencies
        # cryptography is required by pymysql to authenticate against MySQL
        # 8's default caching_sha2_password auth plugin -- without it every
        # connection attempt fails, real production use included, not just
        # this job.
        run: pip install -e ".[dev]" pymysql cryptography
        env:
          MANGOO_SKIP_NATIVE_BUILD: "1"
      - name: Run the opt-in MySQL/MariaDB integration test
        env:
          MANGOO_TEST_MYSQL_NAME: mangoo_test
          MANGOO_TEST_MYSQL_HOST: localhost
          MANGOO_TEST_MYSQL_PORT: "3306"
          MANGOO_TEST_MYSQL_USER: mangoo
          MANGOO_TEST_MYSQL_PASSWORD: mangoo
        run: pytest tests/test_mysql_integration.py --no-cov -v

  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Mangoo with test and Redis dependencies
        run: pip install -e ".[dev]" redis
        env:
          MANGOO_SKIP_NATIVE_BUILD: "1"
      - name: Run the opt-in Redis rate limiter integration test
        env:
          MANGOO_TEST_REDIS_URL: "redis://localhost:6379/0"
        run: pytest tests/test_redis_ratelimiter_integration.py --no-cov -v
