site_name: Hayavega
site_description: A structured Python web framework with automatic, interactive API documentation and a Rust-accelerated core
site_url: https://hayavega.vercel.app/
copyright: Released under the MIT License.

docs_dir: docs
site_dir: site

theme:
  name: material
  # Dark is the unconditional default (first scheme listed, no `media`
  # condition) -- matching reflex.dev/uv/etc., which default to dark
  # regardless of system preference and only switch on an explicit
  # manual toggle click, not automatically via prefers-color-scheme.
  palette:
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font: false
  logo: assets/hayavega-mark.svg
  favicon: assets/favicon.ico
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - announce.dismiss

extra_css:
  - assets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      title: On this page
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            docstring_style: google
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
  - llmstxt:
      markdown_description: |
        Hayavega is a structured Python web framework: a conventional,
        batteries-included project layout, automatic interactive API
        documentation generated from your code, and a Rust core used
        only where it measurably wins a real benchmark.
      sections:
        Getting started:
          - getting-started/installation.md
          - getting-started/quickstart.md
          - getting-started/tutorial.md
        Guides:
          - topics/routing.md
          - topics/models.md
          - topics/forms.md
          - topics/file-uploads.md
          - topics/templates.md
          - topics/auth.md
          - topics/admin.md
          - topics/rest-api.md
          - topics/graphql.md
          - topics/websockets.md
          - topics/deployment.md
        Concepts:
          - topics/middleware.md
          - topics/email.md
          - topics/messages.md
          - topics/caching.md
          - topics/i18n.md
          - topics/asgi.md
          - topics/rust-runtime.md
          - topics/signals.md
          - topics/security.md
          - topics/testing.md
        Reference:
          - performance.md
          - reference/api.md

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/ponugoti-sudhakar-37029a18b
      name: Contact

