[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mangoo"
version = "0.1.0"
description = "A Python web framework with a conventional project structure, automatic interactive API docs, and a Rust core"
requires-python = ">=3.10"
authors = [{name = "Mangoo contributors"}]
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["msgspec>=0.21,<0.23"]

[project.optional-dependencies]
# hatchling is otherwise only a [build-system] requirement -- pip's build
# isolation makes it importable while *building* the mangoo wheel, but does
# not leave it importable in the resulting environment afterward. It has to
# be listed here too because tests/test_hatch_build.py loads hatch_build.py
# directly (exec_module, not a normal package import) to test the build hook
# itself, which imports hatchling.builders.hooks.plugin.interface at module
# level -- without this, a genuinely fresh `pip install -e ".[dev]"` (exactly
# what CI's `test` job does) fails to even collect that test file, aborting
# the whole pytest session (INTERRUPTED, exit code 2) rather than failing
# just the one file. Invisible in any dev environment where hatchling
# happens to already be installed for an unrelated reason.
# pymysql is pure Python and needs no server, so it is listed here so the
# stale-connection reconnect unit tests in tests/test_db.py (which build
# pymysql's exception types against a fake connection) run in CI's `test`
# job, not only in the opt-in mysql-integration job.
# cryptography is optional (see src/mangoo/crypto.py -- it's only used to
# encrypt a TOTP secret at rest, never a mandatory dependency for every
# project), but it's listed here so tests/test_crypto.py and auth.py's
# TOTP-encryption tests exercise the real AES-GCM path in CI's `test` job,
# not just the plaintext fallback `mango diagnose` warns about when it's
# absent.
# python-multipart is likewise optional (see src/mangoo/request.py --
# only needed to parse multipart/form-data file uploads), listed here so
# tests/test_request_multipart.py exercises the real parser in CI, not
# just the MultipartUnavailableError fallback path.
# redis (the pure-Python client, needs no server of its own to import) is
# listed here so tests/test_cacheserver.py can run the *real* redis-py
# client against mango cacheserver -- the server under test is the one
# this repo ships, not an external service, so this doesn't need the
# opt-in redis-integration job's MANGOO_TEST_REDIS_URL gating the way
# tests/test_redis_cache_integration.py (a real external Redis) does.
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.16", "mypy>=1.13", "hatchling>=1.25", "pymysql>=1.1", "cryptography>=42", "python-multipart>=0.0.9", "redis>=5"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "mike>=2.1"]

[project.scripts]
mangoo-admin = "mangoo.cli:main"
mango = "mangoo.cli:main"
mangoo = "mangoo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mangoo"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
addopts = "--cov=mangoo --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/mangoo"]
omit = ["src/mangoo/__main__.py"]

[tool.coverage.report]
skip_covered = false
show_missing = true
fail_under = 100

[tool.mypy]
python_version = "3.10"
files = ["src/mangoo"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# mangoo_native is an optional, self-built Rust extension (see hatch_build.py)
# with no type stubs of its own; psycopg/pymysql are optional PostgreSQL/MySQL
# drivers (see db.py), and redis is an optional Redis rate-limiter backend
# (see hardening.py's RedisRateLimiter) -- none of the three are installed in
# the default dev/type-check environment.
module = ["mangoo_native", "psycopg", "psycopg.*", "pymysql", "pymysql.*", "redis", "redis.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 320
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501", # Line length is a formatter concern here; a few deliberately long lines
            # (an __all__ list, embedded HTML/JS template strings, a status-text dict)
            # would only get worse if force-wrapped. `ruff format` still applies to
            # everything else at the generous line-length above.
]
