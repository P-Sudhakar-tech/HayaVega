[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mangoo"
version = "0.1.0"
description = "A Django-like Python framework with a Rust core"
requires-python = ">=3.10"
authors = [{name = "Mangoo contributors"}]
dependencies = ["msgspec>=0.21,<0.22"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
mangoo-admin = "mangoo.cli:main"
mango = "mangoo.cli:main"
mangoo = "mangoo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mangoo"]

[tool.pytest.ini_options]
addopts = "--cov=mangoo --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/mangoo"]
omit = ["src/mangoo/__main__.py"]

[tool.coverage.report]
skip_covered = false
show_missing = true
fail_under = 85
